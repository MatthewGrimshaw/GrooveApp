name: Docker Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/**'
      - 'app/**'
      - '.github/workflows/docker-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'app/**'

jobs:
  scan-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: grooveapp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: grooveapp-api:${{ github.sha }}
          only-severities: critical,high
          exit-code: true
          sarif-file: sarif.output.json

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif.output.json

  scan-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: grooveapp-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SKIP_AUDIT=false

      - name: Run Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: grooveapp-ui:${{ github.sha }}
          only-severities: critical,high
          exit-code: true
          sarif-file: sarif-frontend.output.json

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-frontend.output.json
          category: frontend
