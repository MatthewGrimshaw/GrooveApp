name: Deploy SQL Schema

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    paths:
      - "infra/setup-music-tables.sql"
      - ".github/workflows/deploy-sql-schema.yml"
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Federated)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SQL Server Details
        id: sql
        run: |
          # Get resource group name
          RG_NAME="rg-grooveapp-${{ env.ENVIRONMENT }}"

          # Get SQL Server name
          SQL_SERVER=$(az sql server list \
            --resource-group $RG_NAME \
            --query "[0].name" -o tsv)

          # Get SQL Server FQDN
          SQL_FQDN=$(az sql server show \
            --name $SQL_SERVER \
            --resource-group $RG_NAME \
            --query fullyQualifiedDomainName -o tsv)

          # Get database name
          SQL_DB=$(az sql db list \
            --resource-group $RG_NAME \
            --server $SQL_SERVER \
            --query "[?name!='master'].name" -o tsv)

          echo "server=$SQL_FQDN" >> $GITHUB_OUTPUT
          echo "database=$SQL_DB" >> $GITHUB_OUTPUT
          echo "server_name=$SQL_SERVER" >> $GITHUB_OUTPUT
          echo "resource_group=$RG_NAME" >> $GITHUB_OUTPUT

      - name: Enable Temporary Firewall Rule
        id: firewall
        run: |
          # Get current public IP
          MY_IP=$(curl -s https://api.ipify.org)
          echo "Deploying from IP: $MY_IP"

          # Add temporary firewall rule
          az sql server firewall-rule create \
            --resource-group ${{ steps.sql.outputs.resource_group }} \
            --server ${{ steps.sql.outputs.server_name }} \
            --name "GitHub-Actions-Temp-$(date +%s)" \
            --start-ip-address $MY_IP \
            --end-ip-address $MY_IP

          echo "rule_name=GitHub-Actions-Temp-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | \
            sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Get Azure AD Access Token
        id: token
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://database.windows.net \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Execute SQL Schema Script
        run: |
          # Execute SQL script using Azure AD authentication
          /opt/mssql-tools18/bin/sqlcmd \
            -S ${{ steps.sql.outputs.server }} \
            -d ${{ steps.sql.outputs.database }} \
            -G \
            -P "${{ steps.token.outputs.token }}" \
            -i infra/setup-music-tables.sql \
            -C \
            -b

      - name: Verify Tables Created
        run: |
          # Verify tables were created successfully
          /opt/mssql-tools18/bin/sqlcmd \
            -S ${{ steps.sql.outputs.server }} \
            -d ${{ steps.sql.outputs.database }} \
            -G \
            -P "${{ steps.token.outputs.token }}" \
            -Q "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;" \
            -C

      - name: Remove Temporary Firewall Rule
        if: always()
        run: |
          # Remove the temporary firewall rule
          RULES=$(az sql server firewall-rule list \
            --resource-group ${{ steps.sql.outputs.resource_group }} \
            --server ${{ steps.sql.outputs.server_name }} \
            --query "[?contains(name, 'GitHub-Actions-Temp')].name" -o tsv)

          for RULE in $RULES; do
            echo "Removing firewall rule: $RULE"
            az sql server firewall-rule delete \
              --resource-group ${{ steps.sql.outputs.resource_group }} \
              --server ${{ steps.sql.outputs.server_name }} \
              --name "$RULE" || true
          done
